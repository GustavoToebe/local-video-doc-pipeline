[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-doc-pipeline"
version = "0.1.0"
description = "Pipeline local para criar documentação técnica a partir de vídeo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "scenedetect>=0.6.2",
  "faster-whisper>=1.0.0",
  "ollama>=0.1.0",
  "torch>=2.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
